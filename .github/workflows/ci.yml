name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Core module (JVM) tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test :core:jar --stacktrace

  android:
    name: Android build, lint-free check & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Robolectric artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.robolectric
            ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble libraries & sample app
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests (incl. Robolectric)
        run: ./gradlew test --stacktrace

      - name: Upload test reports (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore
